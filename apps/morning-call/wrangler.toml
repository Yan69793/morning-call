# TEMPLATE — preencher IDs reais com `wrangler d1 create`, `wrangler kv namespace create`,
# `wrangler r2 bucket create`. NÃO commitar IDs sensíveis se o repo for público.
name = "morning-call"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# MC-029 (14/08/2026): /trigger-now so abre sem secret quando ENVIRONMENT
# nao e "production". O valor de producao precisa existir no deploy real.
[vars]
ENVIRONMENT = "production"

# Cron em UTC. BRT é UTC-3 fixo (o Brasil não observa horário de verão desde 2019).
#   "30 9  * * 1-5" = 06:30 BRT, geração do Morning Call.
#   "30 21 * * 1-5" = 18:30 BRT, marcação a mercado dos trades abertos.
# O cron não conhece feriado de B3 nem de NYSE: o calendário é checado em código, no primeiro
# step do workflow, que aborta cedo em dia sem pregão.
[triggers]
crons = ["30 9 * * 1-5", "30 21 * * 1-5"]

# --- Bindings ---
# `database_id` é placeholder: `--local` ignora, mas o binding precisa existir para as migrations
# rodarem contra o SQLite local. Trocar pelo ID real de `wrangler d1 create morning-call`.
[[d1_databases]]
binding = "DB"
database_name = "morning-call"
database_id = "c9a7fda3-ce3d-4295-96ed-0d2753d21f5b"
migrations_dir = "migrations"

# [[kv_namespaces]]
# binding = "CACHE"
# id = "TODO"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "morning-call-reports"

# [ai]
# binding = "AI"   # Workers AI (Kimi K2.6 e outros)

[assets]
directory = "dist-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
[[workflows]]
name = "morning-call"
binding = "WORKFLOW"
class_name = "MorningCallWorkflow"
