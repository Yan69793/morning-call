# TEMPLATE — preencher IDs reais com `wrangler d1 create`, `wrangler kv namespace create`,
# `wrangler r2 bucket create`. NÃO commitar IDs sensíveis se o repo for público.
name = "morning-call"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Cron 06:30 BRT = 09:30 UTC (BRT = UTC-3). Ajustar se houver horário de verão.
[triggers]
crons = ["30 9 * * 1-5"]

